name: Validate and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version and tag
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY

  tests:
    needs: validate_release
    uses: ./.github/workflows/test.yml

  quality:
    needs: validate_release
    uses: ./.github/workflows/quality.yml

  stability:
    needs: validate_release
    uses: ./.github/workflows/stability-soak.yml
    with:
      profile: standard

  wheels:
    needs: validate_release
    uses: ./.github/workflows/wheels.yml

  validate_artifacts:
    needs: [validate_release, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - name: Check complete wheel matrix and archive contents
        env:
          RELEASE_VERSION: ${{ needs.validate_release.outputs.version }}
        run: python scripts/audit_release_artifacts.py --complete --version "$RELEASE_VERSION"

  publish:
    # Local workflow references use this exact commit. Manual dispatch validates
    # everything but cannot publish; only an explicit matching version tag can.
    needs: [tests, quality, stability, validate_artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
