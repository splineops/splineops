# splineops/.github/workflows/release.yml
name: Build & publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # OIDC for PyPI

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel build

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          # Optional: keep OpenMP ON by default; your CMake gracefully disables if not found
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *musllinux*"
          CIBW_TEST_COMMAND: "python -c \"import importlib.util; import numpy as np; import splineops; print('ok', importlib.util.find_spec('splineops._lsresize') is not None)\""

      - name: Build sdist
        run: python -m build -s -o dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*

  publish:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
