# splineops/.github/workflows/test.yml
name: Test Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # optional but recommended
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tests with tox (current Python only)
        env:
          SPLINEOPS_ACCEL: auto
          OMP_NUM_THREADS: 1        # optional: stable timings
          OPENBLAS_NUM_THREADS: 1   # optional: avoid extra threads
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py