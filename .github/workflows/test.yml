# splineops/.github/workflows/test.yml
name: Test Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # (optional) make scikit-build/CMake extra verbose:
      # env:
      #   SCIKIT_BUILD_CORE_VERBOSE: "1"
      #   CMAKE_ARGS: "-DCMAKE_VERBOSE_MAKEFILE=ON"

      - name: Create tox env & install package (editable)
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py --notest

      - name: Smoke check native extension (inside tox env)
        run: |
          tox -e py -- python - <<'PY'
          import importlib.util, sys
          print("Python:", sys.version.split()[0])
          print("has _lsresize:", importlib.util.find_spec("splineops._lsresize") is not None)
          PY

      - name: Run tests with tox (C++ required)
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py