# splineops/.github/workflows/test.yml
name: Test Library

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # Build the package once (creates .pkg wheel) with C++ enabled
      - name: Create tox env (build extension) — C++ path
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py --notest

      # Smoke check *inside the tox env* (no pytest! just the smoke env)
      - name: Smoke check native extension (inside tox env)
        env:
          SPLINEOPS_ACCEL: always
        run: tox -q -e smoke

      # Run full test suite (C++ required)
      - name: Run tests with tox (C++ required)
        shell: bash
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set +e
          python -m tox -e py 2>&1 | tee tox-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("tox-test.log").read_text(errors="replace").splitlines()
          failure_markers = [
              index for index, line in enumerate(lines) if " FAILURES " in line
          ]
          selected = (
              lines[max(0, failure_markers[-1] - 2) :]
              if failure_markers
              else lines[-60:]
          )
          message = "\n".join(selected)
          if len(message) > 12_000:
              message = message[:9_000] + "\n... annotation shortened ...\n" + message[-3_000:]
          message = (
              message.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=tox pytest failure tail::{message}")
          PY
          fi
          exit "$status"
