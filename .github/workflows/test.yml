# splineops/.github/workflows/test.yml
name: Test Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # Create the tox env & install package once (editable)
      - name: Create tox env (build extension) — C++ path
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py --notest

      # Smoke check *inside the tox env* (C++ module present?)
      - name: Smoke check native extension (inside tox env)
        run: >
          tox -q run -e py -- python -c
          "import importlib.util, sys;
           print('Python:', sys.version.split()[0]);
           print('has _lsresize:', importlib.util.find_spec('splineops._lsresize') is not None)"

      # Run test suite (with C++ required by default)
      - name: Run tests with tox (C++ required)
        env:
          SPLINEOPS_ACCEL: always
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: tox -e py
