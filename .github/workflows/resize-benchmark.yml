name: Resize benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resize-benchmark.yml"
      - "cpp/**"
      - "src/splineops/resize/**"
      - "scripts/benchmark_resize_*.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/resize-benchmark.yml"
      - "cpp/**"
      - "src/splineops/resize/**"
      - "scripts/benchmark_resize_*.py"
  workflow_dispatch:
    inputs:
      profile:
        description: "benchmark profile"
        required: true
        default: "standard"
        type: choice
        options:
          - smoke
          - standard
      repeats:
        description: "timing repeats"
        required: true
        default: "5"

jobs:
  resize-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      BENCHMARK_PROFILE: ${{ inputs.profile || 'smoke' }}
      BENCHMARK_REPEATS: ${{ inputs.repeats || '5' }}
      SPLINEOPS_ACCEL: always
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[tests]'

      - name: Native resize benchmark
        shell: bash
        run: |
          python scripts/benchmark_resize_native.py \
            --profile "${{ env.BENCHMARK_PROFILE }}" \
            --backend native \
            --threads 1,default \
            --repeats "${{ env.BENCHMARK_REPEATS }}" \
            --warmups 2 \
            --batched-axis auto \
            --skip-checks \
            --output-json resize-native.json \
            --output-csv resize-native.csv

      - name: Float32 quality sweep
        shell: bash
        run: |
          python scripts/benchmark_resize_quality.py \
            --profile quick \
            --output-json resize-quality.json \
            --output-csv resize-quality.csv

      - name: ResizePlan reuse benchmark
        shell: bash
        run: |
          python scripts/benchmark_resize_plan.py \
            --profile "${{ env.BENCHMARK_PROFILE }}" \
            --frames 8 \
            --repeats "${{ env.BENCHMARK_REPEATS }}" \
            --warmups 2 \
            --output-json resize-plan.json \
            --output-csv resize-plan.csv

      - name: Compare cubic least-squares batching
        run: >-
          python scripts/benchmark_resize_ls_batching.py
          --repeats "${{ env.BENCHMARK_REPEATS }}"
          --output-json resize-ls-batching.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: resize-benchmark-${{ runner.os }}-${{ github.sha }}
          path: |
            resize-native.json
            resize-native.csv
            resize-quality.json
            resize-quality.csv
            resize-plan.json
            resize-plan.csv
            resize-ls-batching.json
          if-no-files-found: error
