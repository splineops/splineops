name: API stability soak

on:
  push:
    branches: [feature/publication]
    paths:
      - ".github/workflows/stability-soak.yml"
      - "scripts/run_api_stability_soak.py"
      - "src/splineops/affine/**"
      - "src/splineops/differentials/**"
      - "tests/fixtures/affine_coefficients/**"
      - "tests/test_03_02_affine_archive_compatibility.py"
      - "tests/test_09_01_property_contracts.py"
  workflow_dispatch:
    inputs:
      profile:
        description: "soak profile"
        required: true
        default: "standard"
        type: choice
        options: [smoke, standard, extended]

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      SOAK_PROFILE: ${{ inputs.profile || 'smoke' }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run repeated public-API correctness soak
        run: >-
          python scripts/run_api_stability_soak.py
          --profile "${{ env.SOAK_PROFILE }}"
          --output-json api-stability-soak.json

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: api-stability-soak-${{ runner.os }}-${{ env.SOAK_PROFILE }}-${{ github.sha }}
          path: api-stability-soak.json
          if-no-files-found: error
