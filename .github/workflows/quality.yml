name: Quality gates

on:
  push:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          # This job parses gallery sources but does not execute the examples, so
          # avoid pulling heavyweight example-only dependencies such as PyTorch.
          python -m pip install -e '.[docs-core,dev]'

      - name: Formatting
        run: python -m tox -e format-check

      - name: Static typing
        run: python -m tox -e type

      - name: Coverage report
        run: python -m pytest --cov=splineops --cov-report=term-missing --cov-report=xml

      - name: Strict documentation build
        run: |
          # The guides embed gallery-generated figures. A clean, parse-only build
          # cannot create those figures; all other Sphinx warnings remain fatal.
          python -m sphinx -b html docs /tmp/splineops-docs \
            -W --keep-going \
            -D sphinx_gallery_conf.plot_gallery=0 \
            -D suppress_warnings=image.not_readable

      - name: Build wheel and source distribution
        run: python -m build

      - name: Clean wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/splineops-wheel-smoke
          /tmp/splineops-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/splineops-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/splineops-wheel-smoke/bin/python -c "import importlib.util, splineops; assert importlib.util.find_spec('splineops._lsresize')"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
